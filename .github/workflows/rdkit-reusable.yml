name: RDKit Build (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merge_matrix:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DOCKERHUB_PASSWORD:
        required: true

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: cheminfo-db
  ROCKY_VERSION: "9"
  MANIFEST_PUSH_DELAY_SECONDS: "10"

jobs:
  build:
    name: Build postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (local for testing)
        run: |
          LOCAL_TAG="rdkit-test:${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            --build-arg RDKIT_DIST_IMAGE="${{ matrix.rdkit_dist_image }}" \
            -t "${LOCAL_TAG}" \
            --load \
            -f rdkit/Dockerfile rdkit/

      - name: Test image
        run: |
          LOCAL_TAG="rdkit-test:${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}"
          CONTAINER="test-rdkit-${{ matrix.pg_minor }}-${{ matrix.arch }}"

          docker run -d \
            --name "${CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            "${LOCAL_TAG}"

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 60); do
            if docker exec "${CONTAINER}" pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for PostgreSQL"
              docker logs "${CONTAINER}"
              docker stop "${CONTAINER}" && docker rm "${CONTAINER}"
              exit 1
            fi
            sleep 1
          done

          docker exec "${CONTAINER}" psql -U postgres -c "SELECT rdkit_version();"
          docker exec "${CONTAINER}" psql -U postgres -c "SELECT mol_logp(mol_from_smiles('CCO'));"
          docker exec "${CONTAINER}" sh -c "ldd /usr/pgsql-${{ matrix.pg_major }}/lib/rdkit.so | tee /tmp/rdkit-ldd.txt"
          docker exec "${CONTAINER}" sh -c "! grep -E 'libboost_|libRDKit' /tmp/rdkit-ldd.txt"

          docker stop "${CONTAINER}"
          docker rm "${CONTAINER}"

      - name: Push image by digest
        run: |
          REPO="${DOCKER_USER}/${IMAGE_NAME}"
          mkdir -p /tmp/digests

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            --build-arg RDKIT_DIST_IMAGE="${{ matrix.rdkit_dist_image }}" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            -f rdkit/Dockerfile rdkit/

          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          echo "Pushed digest: ${DIGEST}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge manifests for postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.merge_matrix) }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${DOCKER_USER}/${IMAGE_NAME}"
          MINOR="${{ matrix.pg_minor }}"
          MAJOR="${{ matrix.pg_major }}"
          RDKIT="${{ matrix.rdkit_clean }}"

          IMAGES=""
          for digest_file in /tmp/digests/*; do
            digest=$(basename "${digest_file}")
            IMAGES="${IMAGES} ${BASE}@sha256:${digest}"
          done

          TAGS=(
            "rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}"
            "rocky${ROCKY_VERSION}-postgres${MAJOR}-rdkit${RDKIT}"
            "postgres${MAJOR}-rdkit${RDKIT}"
            "postgres${MINOR}-rdkit${RDKIT}"
          )

          for i in "${!TAGS[@]}"; do
            tag="${TAGS[$i]}"
            echo "Publishing manifest ${tag}"
            docker buildx imagetools create \
              -t "${BASE}:${tag}" \
              ${IMAGES}

            if [ "$i" -lt "$(( ${#TAGS[@]} - 1 ))" ]; then
              echo "Sleeping ${MANIFEST_PUSH_DELAY_SECONDS}s to avoid Docker Hub rate limits"
              sleep "${MANIFEST_PUSH_DELAY_SECONDS}"
            fi
          done

  update-docs:
    name: Update README and Docker Hub description
    needs: merge-manifest
    runs-on: ubuntu-24.04
    concurrency:
      group: cheminfo-docs-update
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Query Docker Hub and update version files
        run: |
          python3 << 'PYEOF'
          import json, re, sys, urllib.request

          def fetch_json(url):
              with urllib.request.urlopen(url) as resp:
                  return json.loads(resp.read())

          def get_rdkit_versions():
              versions = set()
              url = "https://hub.docker.com/v2/repositories/antonsiomchen/cheminfo-db/tags/?page_size=100"
              pattern = re.compile(r'^rocky9-postgres\d+\.\d+-rdkit(\d+\.\d+\.\d+)$')
              while url:
                  data = fetch_json(url)
                  for tag_info in data.get("results", []):
                      m = pattern.match(tag_info["name"])
                      if m:
                          versions.add(m.group(1))
                  url = data.get("next")
              return sorted(versions, key=lambda v: tuple(int(x) for x in v.split(".")))

          versions = get_rdkit_versions()
          if not versions:
              print("No RDKit versions found on Docker Hub, skipping update")
              sys.exit(0)

          latest = versions[-1]
          parts = [f"**{v} (latest)**" if v == latest else v for v in versions]
          versions_str = ", ".join(parts)
          print(f"Found versions: {versions_str}")

          with open("README.md") as f:
              content = f.read()
          new_content = re.sub(
              r'(\| \*\*RDKit\*\* \| ).*?( \|)',
              rf'\g<1>{versions_str}\g<2>',
              content,
          )
          if new_content != content:
              with open("README.md", "w") as f:
                  f.write(new_content)
              print("Updated README.md")
          else:
              print("README.md unchanged")

          with open("docker-hub-summary.md") as f:
              content = f.read()
          new_content = re.sub(
              r'(### RDKit Versions\n- ).*',
              rf'\g<1>{versions_str}',
              content,
          )
          if new_content != content:
              with open("docker-hub-summary.md", "w") as f:
                  f.write(new_content)
              print("Updated docker-hub-summary.md")
          else:
              print("docker-hub-summary.md unchanged")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docker-hub-summary.md
          git diff --staged --quiet || (git commit -m "docs: update supported RDKit versions" && git push)

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: antonsiomchen/cheminfo-db
          readme-filepath: docker-hub-summary.md
