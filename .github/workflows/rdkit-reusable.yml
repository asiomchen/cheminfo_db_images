name: RDKit Build (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merge_matrix:
        required: true
        type: string
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: rdkit-postgres
  ROCKY_VERSION: "9"

jobs:
  build:
    name: Build postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local for testing)
        run: |
          LOCAL_TAG="rdkit-test:${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            --build-arg RDKIT_DIST_IMAGE="${{ matrix.rdkit_dist_image }}" \
            -t "${LOCAL_TAG}" \
            --load \
            -f rdkit/Dockerfile rdkit/

      - name: Test image
        run: |
          LOCAL_TAG="rdkit-test:${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}"
          CONTAINER="test-rdkit-${{ matrix.pg_minor }}-${{ matrix.arch }}"

          docker run -d \
            --name "${CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            "${LOCAL_TAG}"

          retry_psql() {
            local description=$1
            local query=$2

            echo "Waiting for PostgreSQL: ${description}"
            for i in $(seq 1 90); do
              if docker exec "${CONTAINER}" psql -U postgres -v ON_ERROR_STOP=1 -c "${query}"; then
                echo "PostgreSQL query succeeded after ${i}s: ${description}"
                return 0
              fi
              if [ "$i" = "90" ]; then
                echo "Timed out waiting for PostgreSQL: ${description}"
                docker logs "${CONTAINER}"
                docker stop "${CONTAINER}" && docker rm "${CONTAINER}"
                exit 1
              fi
              sleep 1
            done
          }

          retry_psql "RDKit version" "SELECT rdkit_version();"
          retry_psql "RDKit mol_logp" "SELECT mol_logp(mol_from_smiles('CCO'));"
          docker exec "${CONTAINER}" sh -c "ldd /usr/pgsql-${{ matrix.pg_major }}/lib/rdkit.so | tee /tmp/rdkit-ldd.txt"
          docker exec "${CONTAINER}" sh -c "! grep -E 'libboost_|libRDKit' /tmp/rdkit-ldd.txt"

          docker stop "${CONTAINER}"
          docker rm "${CONTAINER}"

      - name: Push image by digest
        run: |
          REPO="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          mkdir -p /tmp/digests

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            --build-arg RDKIT_DIST_IMAGE="${{ matrix.rdkit_dist_image }}" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            -f rdkit/Dockerfile rdkit/

          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          echo "Pushed digest: ${DIGEST}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge manifests for postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.merge_matrix) }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-${{ matrix.pg_minor }}-${{ matrix.rdkit_clean }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          MINOR="${{ matrix.pg_minor }}"
          MAJOR="${{ matrix.pg_major }}"
          RDKIT="${{ matrix.rdkit_clean }}"

          IMAGES=""
          for digest_file in /tmp/digests/*; do
            digest=$(basename "${digest_file}")
            IMAGES="${IMAGES} ${BASE}@sha256:${digest}"
          done

          TAGS=(
            "rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}"
            "rocky${ROCKY_VERSION}-postgres${MAJOR}-rdkit${RDKIT}"
            "postgres${MAJOR}-rdkit${RDKIT}"
            "postgres${MINOR}-rdkit${RDKIT}"
          )

          for i in "${!TAGS[@]}"; do
            tag="${TAGS[$i]}"
            echo "Publishing manifest ${tag}"
            docker buildx imagetools create \
              -t "${BASE}:${tag}" \
              ${IMAGES}

          done

  update-docs:
    name: Update README
    needs: merge-manifest
    runs-on: ubuntu-24.04
    concurrency:
      group: cheminfo-docs-update
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Query GHCR and update version files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          python3 -m scripts.actions update-docs rdkit \
            --package-name "${IMAGE_NAME}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update supported RDKit versions" && git push)
