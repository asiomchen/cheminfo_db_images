name: Build Bingo Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: single
        type: choice
        options:
          - single
          - range
      bingo_version:
        description: Bingo version for single mode, for example 1.43.0
        required: false
        type: string
      min_bingo_version:
        description: Minimum Bingo version for range mode, for example 1.34.0
        required: false
        default: "1.34.0"
        type: string
      max_bingo_version:
        description: Maximum Bingo version for range mode, for example 1.43.0
        required: false
        default: ""
        type: string
      pg_majors:
        description: PostgreSQL majors to build, separated by spaces or commas
        required: false
        default: "15 16 17"
        type: string
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: bingo-postgres
  DIST_IMAGE_NAME: bingo-dist
  ROCKY_VERSION: "9"
  PG_MAJORS: "15 16 17"
  DEFAULT_MIN_BINGO_VERSION: "1.34.0"

jobs:
  prepare-matrix:
    name: Prepare runtime build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      merge_matrix: ${{ steps.prepare.outputs.merge_matrix }}
      has_builds: ${{ steps.prepare.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve versions and check GHCR
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          MODE_INPUT: ${{ inputs.mode }}
          BINGO_VERSION_INPUT: ${{ inputs.bingo_version }}
          MIN_BINGO_VERSION_INPUT: ${{ inputs.min_bingo_version }}
          MAX_BINGO_VERSION_INPUT: ${{ inputs.max_bingo_version }}
          PG_MAJORS_INPUT: ${{ inputs.pg_majors }}
        run: |
          MODE="${MODE_INPUT:-range}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            MODE="range"
          fi

          python3 -m scripts.actions prepare-bingo-runtime \
            --registry "${REGISTRY}" \
            --image-owner "${IMAGE_OWNER}" \
            --image-name "${IMAGE_NAME}" \
            --dist-image-name "${DIST_IMAGE_NAME}" \
            --rocky-version "${ROCKY_VERSION}" \
            --pg-majors "${PG_MAJORS_INPUT:-${PG_MAJORS}}" \
            --mode "${MODE}" \
            --bingo-version "${BINGO_VERSION_INPUT}" \
            --min-bingo-version "${MIN_BINGO_VERSION_INPUT:-${DEFAULT_MIN_BINGO_VERSION}}" \
            --max-bingo-version "${MAX_BINGO_VERSION_INPUT}"

  build-and-push:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_builds == 'true'
    uses: ./.github/workflows/bingo-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      merge_matrix: ${{ needs.prepare-matrix.outputs.merge_matrix }}
