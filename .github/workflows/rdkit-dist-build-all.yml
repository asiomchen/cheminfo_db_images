name: Build RDKit Dist Images (All Versions)

on:
  workflow_dispatch:
    inputs:
      min_rdkit_version:
        description: 'Minimum RDKit version to build (e.g. 2024.03.6)'
        required: false
        default: '2024.03.6'
      max_rdkit_version:
        description: 'Maximum RDKit version to build (e.g. 2025.09.1)'
        required: false
        default: ''
#   schedule:
#     - cron: '0 12 * * *'

env:
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: rdkit-postgres-dist
  PG_MAJORS: "16 17 18"

permissions:
  contents: read
  packages: write

jobs:
  detect-versions:
    name: Detect RDKit dist versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect versions and check GHCR
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          MIN_RDKIT_VERSION_INPUT: ${{ inputs.min_rdkit_version }}
          MAX_RDKIT_VERSION_INPUT: ${{ inputs.max_rdkit_version }}
        run: |
          python3 -m scripts.actions prepare-rdkit-dist-all \
            --image-name "${IMAGE_NAME}" \
            --min-rdkit-version "${MIN_RDKIT_VERSION_INPUT:-2024.03.6}" \
            --max-rdkit-version "${MAX_RDKIT_VERSION_INPUT}" \
            --pg-majors "${PG_MAJORS}"

  build-and-push:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    uses: ./.github/workflows/rdkit-dist-reusable.yml
    with:
      matrix: ${{ needs.detect-versions.outputs.matrix }}
      merge_matrix: ${{ needs.detect-versions.outputs.merge_matrix }}
