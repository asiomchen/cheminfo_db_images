name: Build RDKit Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: cheminfo-db
  ROCKY_VERSION: "9"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - name: Detect versions and check Docker Hub
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          get_latest_pg_minor() {
            local major=$1
            curl -s "https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100&name=${major}." \
              | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)
          major_ver = sys.argv[1]
          tags = [r['name'] for r in data['results']]
          regex = re.compile(r'^' + re.escape(major_ver) + r'\.\d+$')
          valid_tags = [t for t in tags if regex.match(t)]
          valid_tags.sort(key=lambda s: [int(u) for u in s.split('.')])
          if valid_tags:
              print(valid_tags[-1])
          " "$major"
          }

          PG16=$(get_latest_pg_minor 16)
          PG17=$(get_latest_pg_minor 17)
          PG18=$(get_latest_pg_minor 18)
          echo "PG versions: PG16=${PG16}, PG17=${PG17}, PG18=${PG18}"

          RDKIT_TAG=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/rdkit/rdkit/releases/latest" \
            | jq -r '.tag_name')
          RDKIT_CLEAN=$(echo "$RDKIT_TAG" | sed 's/Release_//g' | sed 's/_/./g')
          echo "Latest RDKit: ${RDKIT_TAG} -> ${RDKIT_CLEAN}"

          matrix_entries=()
          merge_entries=()

          for pg_minor in "$PG16" "$PG17" "$PG18"; do
            pg_major=$(echo "$pg_minor" | cut -d. -f1)
            tag="rocky${ROCKY_VERSION}-postgres${pg_minor}-rdkit${RDKIT_CLEAN}"
            echo "Checking Docker Hub for: ${tag}"
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/${tag}/")

            if [ "$http_code" = "404" ]; then
              echo "  -> Missing, will build"
              for arch in amd64 arm64; do
                if [ "$arch" = "amd64" ]; then
                  runner="ubuntu-24.04"
                  platform="linux/amd64"
                else
                  runner="ubuntu-24.04-arm"
                  platform="linux/arm64"
                fi
                entry=$(jq -cn \
                  --arg pg_minor "$pg_minor" \
                  --arg pg_major "$pg_major" \
                  --arg rdkit_ref "$RDKIT_TAG" \
                  --arg rdkit_clean "$RDKIT_CLEAN" \
                  --arg arch "$arch" \
                  --arg runner "$runner" \
                  --arg platform "$platform" \
                  '{pg_minor: $pg_minor, pg_major: $pg_major, rdkit_ref: $rdkit_ref, rdkit_clean: $rdkit_clean, arch: $arch, runner: $runner, platform: $platform}')
                matrix_entries+=("$entry")
              done
              merge_entry=$(jq -cn \
                --arg pg_minor "$pg_minor" \
                --arg pg_major "$pg_major" \
                --arg rdkit_ref "$RDKIT_TAG" \
                --arg rdkit_clean "$RDKIT_CLEAN" \
                '{pg_minor: $pg_minor, pg_major: $pg_major, rdkit_ref: $rdkit_ref, rdkit_clean: $rdkit_clean}')
              merge_entries+=("$merge_entry")
            else
              echo "  -> Already exists (HTTP ${http_code}), skipping"
            fi
          done

          if [ ${#matrix_entries[@]} -gt 0 ]; then
            matrix=$(printf '%s\n' "${matrix_entries[@]}" | jq -sc '{include: .}')
            merge_matrix=$(printf '%s\n' "${merge_entries[@]}" | jq -sc '{include: .}')
            has_builds="true"
          else
            matrix='{"include":[]}'
            merge_matrix='{"include":[]}'
            has_builds="false"
          fi

          echo "has_builds=${has_builds}"
          {
            echo "matrix=${matrix}"
            echo "merge_matrix=${merge_matrix}"
            echo "has_builds=${has_builds}"
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    uses: ./.github/workflows/rdkit-reusable.yml
    with:
      matrix: ${{ needs.detect-versions.outputs.matrix }}
      merge_matrix: ${{ needs.detect-versions.outputs.merge_matrix }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
