name: Build RDKit Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: cheminfo-db
  ROCKY_VERSION: "9"
  BOOST_VERSION: "1.84.0"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - name: Detect versions and check Docker Hub
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          get_latest_pg_minor() {
            local major=$1
            curl -s "https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100&name=${major}." \
              | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)
          major_ver = sys.argv[1]
          tags = [r['name'] for r in data['results']]
          regex = re.compile(r'^' + re.escape(major_ver) + r'\.\d+$')
          valid_tags = [t for t in tags if regex.match(t)]
          valid_tags.sort(key=lambda s: [int(u) for u in s.split('.')])
          if valid_tags:
              print(valid_tags[-1])
          " "$major"
          }

          PG16=$(get_latest_pg_minor 16)
          PG17=$(get_latest_pg_minor 17)
          PG18=$(get_latest_pg_minor 18)
          echo "PG versions: PG16=${PG16}, PG17=${PG17}, PG18=${PG18}"

          RDKIT_TAG=$(curl -s \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/rdkit/rdkit/releases/latest" \
            | jq -r '.tag_name')
          RDKIT_CLEAN=$(echo "$RDKIT_TAG" | sed 's/Release_//g' | sed 's/_/./g')
          echo "Latest RDKit: ${RDKIT_TAG} -> ${RDKIT_CLEAN}"

          matrix_entries=()
          merge_entries=()

          for pg_minor in "$PG16" "$PG17" "$PG18"; do
            pg_major=$(echo "$pg_minor" | cut -d. -f1)
            tag="rocky${ROCKY_VERSION}-postgres${pg_minor}-rdkit${RDKIT_CLEAN}"
            echo "Checking Docker Hub for: ${tag}"
            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://hub.docker.com/v2/repositories/${DOCKER_USER}/${IMAGE_NAME}/tags/${tag}/")

            if [ "$http_code" = "404" ]; then
              echo "  -> Missing, will build"
              for arch in amd64 arm64; do
                if [ "$arch" = "amd64" ]; then
                  runner="ubuntu-24.04"
                  platform="linux/amd64"
                else
                  runner="ubuntu-24.04-arm"
                  platform="linux/arm64"
                fi
                entry=$(jq -cn \
                  --arg pg_minor "$pg_minor" \
                  --arg pg_major "$pg_major" \
                  --arg rdkit_ref "$RDKIT_TAG" \
                  --arg rdkit_clean "$RDKIT_CLEAN" \
                  --arg arch "$arch" \
                  --arg runner "$runner" \
                  --arg platform "$platform" \
                  '{pg_minor: $pg_minor, pg_major: $pg_major, rdkit_ref: $rdkit_ref, rdkit_clean: $rdkit_clean, arch: $arch, runner: $runner, platform: $platform}')
                matrix_entries+=("$entry")
              done
              merge_entry=$(jq -cn \
                --arg pg_minor "$pg_minor" \
                --arg pg_major "$pg_major" \
                --arg rdkit_ref "$RDKIT_TAG" \
                --arg rdkit_clean "$RDKIT_CLEAN" \
                '{pg_minor: $pg_minor, pg_major: $pg_major, rdkit_ref: $rdkit_ref, rdkit_clean: $rdkit_clean}')
              merge_entries+=("$merge_entry")
            else
              echo "  -> Already exists (HTTP ${http_code}), skipping"
            fi
          done

          if [ ${#matrix_entries[@]} -gt 0 ]; then
            matrix=$(printf '%s\n' "${matrix_entries[@]}" | jq -sc '{include: .}')
            merge_matrix=$(printf '%s\n' "${merge_entries[@]}" | jq -sc '{include: .}')
            has_builds="true"
          else
            matrix='{"include":[]}'
            merge_matrix='{"include":[]}'
            has_builds="false"
          fi

          echo "has_builds=${has_builds}"
          {
            echo "matrix=${matrix}"
            echo "merge_matrix=${merge_matrix}"
            echo "has_builds=${has_builds}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg BOOST_VERSION="${BOOST_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            -t "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}" \
            --load \
            -f rdkit/Dockerfile rdkit/

      - name: Test image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          CONTAINER="test-rdkit-${{ matrix.pg_minor }}-${{ matrix.arch }}"

          docker run -d \
            --name "${CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}"

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 60); do
            if docker exec "${CONTAINER}" pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for PostgreSQL"
              docker logs "${CONTAINER}"
              docker stop "${CONTAINER}" && docker rm "${CONTAINER}"
              exit 1
            fi
            sleep 1
          done

          docker exec "${CONTAINER}" psql -U postgres -c "SELECT rdkit_version();"
          docker exec "${CONTAINER}" psql -U postgres -c "SELECT mol_logp(mol_from_smiles('CCO'));"

          docker stop "${CONTAINER}"
          docker rm "${CONTAINER}"

      - name: Push per-arch image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          docker push "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}"

  merge-manifest:
    name: Merge manifests for postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}
    needs: [detect-versions, build]
    if: needs.detect-versions.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-versions.outputs.merge_matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${DOCKER_USER}/${IMAGE_NAME}"
          MINOR="${{ matrix.pg_minor }}"
          MAJOR="${{ matrix.pg_major }}"
          RDKIT="${{ matrix.rdkit_clean }}"

          SRC_AMD64="${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}-amd64"
          SRC_ARM64="${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}-arm64"

          # canonical full tag
          docker buildx imagetools create \
            -t "${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          # full tag with major PG version
          docker buildx imagetools create \
            -t "${BASE}:rocky${ROCKY_VERSION}-postgres${MAJOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          # simplified tags (no OS prefix, rocky9 is the only supported OS)
          docker buildx imagetools create \
            -t "${BASE}:postgres${MAJOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          docker buildx imagetools create \
            -t "${BASE}:postgres${MINOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"
