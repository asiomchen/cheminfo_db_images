name: Bingo Dist Build (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merge_matrix:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: bingo-dist
  ROCKY_VERSION: "9"
  MANIFEST_PUSH_DELAY_SECONDS: "5"

jobs:
  build:
    name: Build dist ${{ matrix.bingo_version }}-postgres${{ matrix.pg_major }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image locally for archive validation
        run: |
          LOCAL_TAG="bingo-dist:${{ matrix.bingo_version }}-postgres${{ matrix.pg_major }}-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg INDIGO_REF="${{ matrix.indigo_ref }}" \
            --build-arg BINGO_VERSION="${{ matrix.bingo_version }}" \
            -t "${LOCAL_TAG}" \
            --load \
            -f bingo/Dockerfile.dist bingo/

      - name: Validate built archive contents
        run: |
          set -euo pipefail

          LOCAL_TAG="bingo-dist:${{ matrix.bingo_version }}-postgres${{ matrix.pg_major }}-${{ matrix.arch }}"
          CONTAINER="test-bingo-dist-${{ matrix.pg_major }}-${{ matrix.arch }}"

          cleanup() {
            docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
          }

          dump_debug() {
            set +e
            echo "::group::Validation debug"
            echo "Container: ${CONTAINER}"
            echo "Image: ${LOCAL_TAG}"
            docker ps -a --filter "name=^${CONTAINER}$" || true
            docker logs "${CONTAINER}" 2>&1 || true
            docker exec "${CONTAINER}" sh -lc 'echo "/out contents:"; ls -lah /out || true' || true
            docker exec "${CONTAINER}" sh -lc 'if [ -f /out/bingo-postgres.tgz ]; then echo "Archive size:"; ls -lh /out/bingo-postgres.tgz; fi' || true
            docker exec "${CONTAINER}" sh -lc 'if [ -f /tmp/archive-contents.txt ]; then echo "Archive listing preview:"; sed -n "1,120p" /tmp/archive-contents.txt; fi' || true
            echo "::endgroup::"
            set -e
          }

          fail_check() {
            printf '%s\n' "Validation failed: $1" >&2
            dump_debug
            exit 1
          }

          run_check() {
            local message=$1
            shift
            "$@" || fail_check "${message}"
          }

          trap cleanup EXIT

          run_check \
            "unable to start validation container" \
            docker run -d --name "${CONTAINER}" "${LOCAL_TAG}" sh -lc "sleep 600"
          run_check \
            "missing /out/bingo-postgres.tgz" \
            docker exec "${CONTAINER}" test -f /out/bingo-postgres.tgz
          run_check \
            "unable to list archive contents" \
            docker exec "${CONTAINER}" sh -lc "tar -tzf /out/bingo-postgres.tgz > /tmp/archive-contents.txt"
          run_check \
            "archive does not contain root-level bingo-pg-install.sh" \
            docker exec "${CONTAINER}" grep -E '^([^/]+/)?bingo-pg-install.sh$' /tmp/archive-contents.txt
          run_check \
            "archive does not contain lib/libbingo-postgres.so" \
            docker exec "${CONTAINER}" grep -E '(^|/)lib/libbingo-postgres.so$' /tmp/archive-contents.txt

      - name: Push image by digest
        run: |
          REPO="${DOCKER_USER}/${IMAGE_NAME}"
          mkdir -p /tmp/digests

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg INDIGO_REF="${{ matrix.indigo_ref }}" \
            --build-arg BINGO_VERSION="${{ matrix.bingo_version }}" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            -f bingo/Dockerfile.dist bingo/

          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          echo "Pushed digest: ${DIGEST}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.pg_major }}-${{ matrix.bingo_version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Publish multi-arch dist ${{ matrix.bingo_version }}-postgres${{ matrix.pg_major }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.merge_matrix) }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-${{ matrix.pg_major }}-${{ matrix.bingo_version }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${DOCKER_USER}/${IMAGE_NAME}"
          TAG="${{ matrix.bingo_version }}-postgres${{ matrix.pg_major }}"

          IMAGES=""
          for digest_file in /tmp/digests/*; do
            digest=$(basename "${digest_file}")
            IMAGES="${IMAGES} ${BASE}@sha256:${digest}"
          done

          echo "Publishing manifest ${TAG}"
          docker buildx imagetools create \
            -t "${BASE}:${TAG}" \
            ${IMAGES}

          echo "Sleeping ${MANIFEST_PUSH_DELAY_SECONDS}s to avoid Docker Hub rate limits"
          sleep "${MANIFEST_PUSH_DELAY_SECONDS}"
