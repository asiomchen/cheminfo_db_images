name: Bingo Build (Reusable)

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merge_matrix:
        required: true
        type: string
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: bingo-postgres
  ROCKY_VERSION: "9"

jobs:
  build:
    name: Build postgres${{ matrix.pg_minor }}-bingo${{ matrix.bingo_version }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local for testing)
        run: |
          LOCAL_TAG="bingo-test:${{ matrix.pg_minor }}-${{ matrix.bingo_version }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg BINGO_VERSION="${{ matrix.bingo_version }}" \
            --build-arg BINGO_DIST_IMAGE="${{ matrix.bingo_dist_image }}" \
            -t "${LOCAL_TAG}" \
            --load \
            -f bingo/Dockerfile bingo/

      - name: Test image
        run: |
          LOCAL_TAG="bingo-test:${{ matrix.pg_minor }}-${{ matrix.bingo_version }}"
          CONTAINER="test-bingo-${{ matrix.pg_minor }}-${{ matrix.bingo_version }}-${{ matrix.arch }}"

          docker run -d \
            --name "${CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            "${LOCAL_TAG}"

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 60); do
            if docker exec "${CONTAINER}" pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for PostgreSQL"
              docker logs "${CONTAINER}"
              docker stop "${CONTAINER}" && docker rm "${CONTAINER}"
              exit 1
            fi
            sleep 1
          done

          docker exec "${CONTAINER}" psql -U postgres -c "SELECT bingo.GetVersion();"

          docker stop "${CONTAINER}"
          docker rm "${CONTAINER}"

      - name: Push image by digest
        run: |
          REPO="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          mkdir -p /tmp/digests

          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg BINGO_VERSION="${{ matrix.bingo_version }}" \
            --build-arg BINGO_DIST_IMAGE="${{ matrix.bingo_dist_image }}" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/metadata.json \
            -f bingo/Dockerfile bingo/

          DIGEST=$(jq -r '."containerimage.digest"' /tmp/metadata.json)
          echo "Pushed digest: ${DIGEST}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digest-${{ matrix.pg_minor }}-${{ matrix.bingo_version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Merge manifests for postgres${{ matrix.pg_minor }}-bingo${{ matrix.bingo_version }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.merge_matrix) }}
    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: digest-${{ matrix.pg_minor }}-${{ matrix.bingo_version }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          MINOR="${{ matrix.pg_minor }}"
          MAJOR="${{ matrix.pg_major }}"
          BINGO="${{ matrix.bingo_version }}"

          IMAGES=""
          for digest_file in /tmp/digests/*; do
            digest=$(basename "${digest_file}")
            IMAGES="${IMAGES} ${BASE}@sha256:${digest}"
          done

          TAGS=(
            "rocky${ROCKY_VERSION}-postgres${MINOR}-bingo${BINGO}"
            "rocky${ROCKY_VERSION}-postgres${MAJOR}-bingo${BINGO}"
            "postgres${MAJOR}-bingo${BINGO}"
            "postgres${MINOR}-bingo${BINGO}"
          )

          for i in "${!TAGS[@]}"; do
            tag="${TAGS[$i]}"
            echo "Publishing manifest ${tag}"
            docker buildx imagetools create \
              -t "${BASE}:${tag}" \
              ${IMAGES}

          done

  update-docs:
    name: Update README
    needs: merge-manifest
    runs-on: ubuntu-24.04
    concurrency:
      group: cheminfo-docs-update
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Query GHCR and update version files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
        run: |
          python3 -m scripts.actions update-docs bingo \
            --package-name "${IMAGE_NAME}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: update supported Bingo versions" && git push)
