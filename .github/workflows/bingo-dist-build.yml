name: Build Bingo Dist Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: single
        type: choice
        options:
          - single
          - range
      bingo_version:
        description: Bingo version for single mode, for example 1.43.0
        required: false
        type: string
      min_bingo_version:
        description: Minimum Bingo version for range mode, for example 1.40.0
        required: false
        type: string
      max_bingo_version:
        description: Maximum Bingo version for range mode, for example 1.43.0
        required: false
        type: string
      pg_majors:
        description: PostgreSQL majors to build, separated by spaces or commas
        required: false
        default: "15 16 17"
        type: string

env:
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: bingo-dist

permissions:
  contents: read
  packages: write

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      merge_matrix: ${{ steps.prepare.outputs.merge_matrix }}
      has_builds: ${{ steps.prepare.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Resolve versions and check GHCR
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          MODE: ${{ inputs.mode }}
          BINGO_VERSION_INPUT: ${{ inputs.bingo_version }}
          MIN_BINGO_VERSION_INPUT: ${{ inputs.min_bingo_version }}
          MAX_BINGO_VERSION_INPUT: ${{ inputs.max_bingo_version }}
          PG_MAJORS_INPUT: ${{ inputs.pg_majors }}
        run: |
          python3 << 'EOF'
          import json, os, re, urllib.request

          from scripts.registry_helpers import ghcr_tag_exists

          IMAGE_NAME = os.environ["IMAGE_NAME"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
          MODE = os.environ["MODE"].strip()
          BINGO_VERSION_INPUT = os.environ.get("BINGO_VERSION_INPUT", "").strip()
          MIN_BINGO_VERSION_INPUT = os.environ.get("MIN_BINGO_VERSION_INPUT", "").strip()
          MAX_BINGO_VERSION_INPUT = os.environ.get("MAX_BINGO_VERSION_INPUT", "").strip()
          PG_MAJORS_INPUT = os.environ["PG_MAJORS_INPUT"].strip()

          NUMERIC_SEMVER = re.compile(r"^\d+\.\d+\.\d+$")
          INDIGO_TAG = re.compile(r"^indigo-(\d+\.\d+\.\d+)$")

          def fetch_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          def github_headers():
              return {
                  "Authorization": f"token {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
              }

          def version_tuple(version):
              return tuple(int(part) for part in version.split("."))

          def parse_numeric_semver(value, field_name):
              if not value:
                  raise RuntimeError(f"Missing required value: {field_name}")
              if not NUMERIC_SEMVER.fullmatch(value):
                  raise RuntimeError(
                      f"Unexpected {field_name}: {value}. Expected numeric semver X.Y.Z"
                  )
              return value

          def parse_pg_majors(raw_value):
              values = [value for value in re.split(r"[\s,]+", raw_value) if value]
              if not values:
                  raise RuntimeError("No PostgreSQL majors provided")

              unique_values = []
              seen = set()
              for value in values:
                  if not re.fullmatch(r"\d+", value):
                      raise RuntimeError(
                          f"Unexpected PostgreSQL major value: {value}"
                      )
                  if value not in seen:
                      seen.add(value)
                      unique_values.append(value)
              return unique_values

          def get_version_from_indigo(indigo_ref):
              version_url = (
                  f"https://raw.githubusercontent.com/epam/Indigo/{indigo_ref}/.ci/version.txt"
              )
              version_txt = urllib.request.urlopen(version_url).read().decode()
              lines = [line.strip() for line in version_txt.splitlines() if line.strip()]
              if not lines:
                  raise RuntimeError(
                      f"Unexpected version.txt format for {indigo_ref}"
                  )
              return lines[0]

          def get_numeric_indigo_releases():
              releases = []
              page = 1
              while True:
                  url = (
                      "https://api.github.com/repos/epam/Indigo/releases"
                      f"?per_page=100&page={page}"
                  )
                  items = fetch_json(url, github_headers())
                  if not items:
                      break
                  for release in items:
                      if release.get("draft") or release.get("prerelease"):
                          continue
                      tag_name = release["tag_name"]
                      match = INDIGO_TAG.fullmatch(tag_name)
                      if not match:
                          continue
                      bingo_version = match.group(1)
                      if not NUMERIC_SEMVER.fullmatch(bingo_version):
                          continue
                      releases.append({
                          "indigo_ref": tag_name,
                          "bingo_version": bingo_version,
                      })
                  page += 1

              releases.sort(key=lambda item: version_tuple(item["bingo_version"]))
              deduped = []
              seen_versions = set()
              for release in releases:
                  version = release["bingo_version"]
                  if version in seen_versions:
                      continue
                  seen_versions.add(version)
                  deduped.append(release)
              return deduped

          def tag_exists(tag):
              return ghcr_tag_exists(IMAGE_NAME, tag)

          def build_targets():
              releases = get_numeric_indigo_releases()
              release_map = {item["bingo_version"]: item for item in releases}

              if MODE == "single":
                  version = parse_numeric_semver(
                      BINGO_VERSION_INPUT,
                      "bingo_version",
                  )
                  if version not in release_map:
                      raise RuntimeError(
                          f"No GitHub release found for Bingo version {version}"
                      )
                  return [release_map[version]]

              if MODE == "range":
                  min_version = parse_numeric_semver(
                      MIN_BINGO_VERSION_INPUT,
                      "min_bingo_version",
                  )
                  max_version = None
                  if MAX_BINGO_VERSION_INPUT:
                      max_version = parse_numeric_semver(
                          MAX_BINGO_VERSION_INPUT,
                          "max_bingo_version",
                      )
                      if version_tuple(max_version) < version_tuple(min_version):
                          raise RuntimeError(
                              "max_bingo_version must be greater than or equal to min_bingo_version"
                          )

                  filtered = [
                      item for item in releases
                      if version_tuple(item["bingo_version"]) >= version_tuple(min_version)
                      and (
                          max_version is None
                          or version_tuple(item["bingo_version"]) <= version_tuple(max_version)
                      )
                  ]
                  if not filtered:
                      bound = f"{min_version}..{max_version}" if max_version else f">={min_version}"
                      raise RuntimeError(f"No numeric Bingo releases found for range {bound}")
                  return filtered

              raise RuntimeError(f"Unsupported mode: {MODE}")

          def main():
              pg_majors = parse_pg_majors(PG_MAJORS_INPUT)
              targets = build_targets()

              print(f"Mode: {MODE}", flush=True)
              print(
                  "Selected Bingo versions: "
                  + ", ".join(target["bingo_version"] for target in targets),
                  flush=True,
              )
              print(f"Requested PostgreSQL majors: {' '.join(pg_majors)}", flush=True)

              matrix_entries = []
              merge_entries = []

              for target in targets:
                  bingo_version = target["bingo_version"]
                  indigo_ref = target["indigo_ref"]
                  version_from_repo = get_version_from_indigo(indigo_ref)
                  if version_from_repo != bingo_version:
                      raise RuntimeError(
                          f"Version mismatch for {indigo_ref}: "
                          f"derived {bingo_version}, version.txt has {version_from_repo}"
                      )

                  for pg_major in pg_majors:
                      tag = f"{bingo_version}-postgres{pg_major}"
                      print(f"Checking: {tag}", flush=True)
                      if tag_exists(tag):
                          print("  -> exists, skipping", flush=True)
                          continue

                      print("  -> missing, will build", flush=True)
                      for arch, runner, platform in [
                          ("amd64", "ubuntu-24.04", "linux/amd64"),
                          ("arm64", "ubuntu-24.04-arm", "linux/arm64"),
                      ]:
                          matrix_entries.append({
                              "pg_major": pg_major,
                              "indigo_ref": indigo_ref,
                              "bingo_version": bingo_version,
                              "arch": arch,
                              "runner": runner,
                              "platform": platform,
                          })
                      merge_entries.append({
                          "pg_major": pg_major,
                          "bingo_version": bingo_version,
                      })

              has_builds = len(matrix_entries) > 0
              matrix = json.dumps({"include": matrix_entries})
              merge_matrix = json.dumps({"include": merge_entries})

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"matrix={matrix}\n")
                  f.write(f"merge_matrix={merge_matrix}\n")
                  f.write(f"has_builds={'true' if has_builds else 'false'}\n")

          main()
          EOF

  build-and-push:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.has_builds == 'true'
    uses: ./.github/workflows/bingo-dist-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      merge_matrix: ${{ needs.prepare-matrix.outputs.merge_matrix }}
