name: Build RDKit Images (All Versions)

on:
  workflow_dispatch:
    inputs:
      min_rdkit_version:
        description: 'Minimum RDKit version to build (e.g. 2024.03.6)'
        required: false
        default: '2025.03.1'
      max_rdkit_version:
        description: 'Maximum RDKit version to build (e.g. 2025.09.1)'
        required: false
        default: ''
#   schedule:
#     - cron: '0 18 * * *'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: rdkit-postgres
  DIST_IMAGE_NAME: rdkit-postgres-dist
  ROCKY_VERSION: "9"
  PG_MAJORS: "16 17 18"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect versions and check GHCR
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          MIN_RDKIT_VERSION_INPUT: ${{ inputs.min_rdkit_version }}
          MAX_RDKIT_VERSION_INPUT: ${{ inputs.max_rdkit_version }}
        run: |
          python3 -m scripts.actions prepare-rdkit-runtime-all \
            --registry "${REGISTRY}" \
            --image-owner "${IMAGE_OWNER}" \
            --image-name "${IMAGE_NAME}" \
            --dist-image-name "${DIST_IMAGE_NAME}" \
            --rocky-version "${ROCKY_VERSION}" \
            --pg-majors "${PG_MAJORS}" \
            --min-rdkit-version "${MIN_RDKIT_VERSION_INPUT:-2024.03.6}" \
            --max-rdkit-version "${MAX_RDKIT_VERSION_INPUT}"

  build-and-push:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    uses: ./.github/workflows/rdkit-reusable.yml
    with:
      matrix: ${{ needs.detect-versions.outputs.matrix }}
      merge_matrix: ${{ needs.detect-versions.outputs.merge_matrix }}
