name: Build RDKit Images (All Versions)

on:
  workflow_dispatch:
    inputs:
      min_rdkit_version:
        description: 'Minimum RDKit version to build (e.g. 2024.03.6)'
        required: false
        default: '2024.03.6'
  # schedule:
  #   - cron: '0 6 * * *'

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: cheminfo-db
  ROCKY_VERSION: "9"
  BOOST_VERSION: "1.84.0"
  PG_MAJORS: "16 17 18"
  MIN_RDKIT_VERSION: "2024.03.6"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - name: Detect versions and check Docker Hub
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_RDKIT_VERSION_INPUT: ${{ inputs.min_rdkit_version }}
        run: |
          python3 << 'EOF'
          import json, os, re, urllib.request

          DOCKER_USER = os.environ["DOCKER_USER"]
          IMAGE_NAME  = os.environ["IMAGE_NAME"]
          ROCKY_VERSION = os.environ["ROCKY_VERSION"]
          PG_MAJORS   = os.environ["PG_MAJORS"].split()
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
          MIN_VERSION = os.environ.get("MIN_RDKIT_VERSION_INPUT") or os.environ["MIN_RDKIT_VERSION"]

          def fetch_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          def get_latest_pg_minor(major):
              url = f"https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100&name={major}."
              data = fetch_json(url)
              pattern = re.compile(r'^' + re.escape(str(major)) + r'\.\d+$')
              tags = [r["name"] for r in data["results"] if pattern.match(r["name"])]
              tags.sort(key=lambda s: [int(u) for u in s.split(".")])
              return tags[-1] if tags else None

          def version_tuple(v):
              return tuple(int(x) for x in v.split("."))

          def get_rdkit_releases(min_version):
              min_v = version_tuple(min_version)
              pattern = re.compile(r'^Release_\d{4}_\d{2}_\d+$')
              headers = {
                  "Authorization": f"token {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
              }
              releases = []
              for page in (1, 2):
                  url = f"https://api.github.com/repos/rdkit/rdkit/releases?per_page=100&page={page}"
                  for r in fetch_json(url, headers):
                      tag = r["tag_name"]
                      if not pattern.match(tag):
                          continue
                      clean = tag.replace("Release_", "").replace("_", ".")
                      if version_tuple(clean) >= min_v:
                          releases.append({"ref": tag, "clean": clean})
              return releases

          def tag_exists(tag):
              url = f"https://hub.docker.com/v2/repositories/{DOCKER_USER}/{IMAGE_NAME}/tags/{tag}/"
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status == 200
              except urllib.error.HTTPError as e:
                  return e.code != 404

          def main():
              pg_minors = {}
              for major in PG_MAJORS:
                  minor = get_latest_pg_minor(major)
                  print(f"PG{major} latest minor: {minor}", flush=True)
                  pg_minors[major] = minor

              rdkit_releases = get_rdkit_releases(MIN_VERSION)
              print(f"RDKit releases >= {MIN_VERSION}: {[r['clean'] for r in rdkit_releases]}", flush=True)

              matrix_entries = []
              merge_entries  = []

              for major, minor in pg_minors.items():
                  for rdkit in rdkit_releases:
                      tag = f"rocky{ROCKY_VERSION}-postgres{minor}-rdkit{rdkit['clean']}"
                      print(f"Checking: {tag}", flush=True)
                      if tag_exists(tag):
                          print(f"  -> exists, skipping", flush=True)
                          continue
                      print(f"  -> missing, will build", flush=True)
                      for arch, runner, platform in [
                          ("amd64", "ubuntu-24.04",     "linux/amd64"),
                          ("arm64", "ubuntu-24.04-arm", "linux/arm64"),
                      ]:
                          matrix_entries.append({
                              "pg_minor":   minor,
                              "pg_major":   major,
                              "rdkit_ref":  rdkit["ref"],
                              "rdkit_clean": rdkit["clean"],
                              "arch":       arch,
                              "runner":     runner,
                              "platform":   platform,
                          })
                      merge_entries.append({
                          "pg_minor":   minor,
                          "pg_major":   major,
                          "rdkit_ref":  rdkit["ref"],
                          "rdkit_clean": rdkit["clean"],
                      })

              has_builds   = len(matrix_entries) > 0
              matrix       = json.dumps({"include": matrix_entries})
              merge_matrix = json.dumps({"include": merge_entries})
              print(f"has_builds={has_builds}, {len(merge_entries)} combos to build", flush=True)

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"matrix={matrix}\n")
                  f.write(f"merge_matrix={merge_matrix}\n")
                  f.write(f"has_builds={'true' if has_builds else 'false'}\n")

          main()
          EOF

  build:
    name: Build postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-versions.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ROCKY_VERSION="${ROCKY_VERSION}" \
            --build-arg BOOST_VERSION="${BOOST_VERSION}" \
            --build-arg POSTGRES_VERSION="${{ matrix.pg_minor }}" \
            --build-arg POSTGRES_MAJOR_VERSION="${{ matrix.pg_major }}" \
            --build-arg RDKIT_GIT_REF="${{ matrix.rdkit_ref }}" \
            -t "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}" \
            --load \
            -f rdkit/Dockerfile rdkit/

      - name: Test image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          CONTAINER="test-rdkit-${{ matrix.pg_minor }}-${{ matrix.arch }}"

          docker run -d \
            --name "${CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}"

          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 60); do
            if docker exec "${CONTAINER}" pg_isready -U postgres 2>/dev/null; then
              echo "PostgreSQL is ready after ${i}s"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Timed out waiting for PostgreSQL"
              docker logs "${CONTAINER}"
              docker stop "${CONTAINER}" && docker rm "${CONTAINER}"
              exit 1
            fi
            sleep 1
          done

          docker exec "${CONTAINER}" psql -U postgres -c "SELECT rdkit_version();"
          docker exec "${CONTAINER}" psql -U postgres -c "SELECT mol_logp(mol_from_smiles('CCO'));"

          docker stop "${CONTAINER}"
          docker rm "${CONTAINER}"

      - name: Push per-arch image
        run: |
          ARCH_TAG="rocky${ROCKY_VERSION}-postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}-${{ matrix.arch }}"
          docker push "${DOCKER_USER}/${IMAGE_NAME}:${ARCH_TAG}"

  merge-manifest:
    name: Merge manifests for postgres${{ matrix.pg_minor }}-rdkit${{ matrix.rdkit_clean }}
    needs: [detect-versions, build]
    if: needs.detect-versions.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-versions.outputs.merge_matrix) }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          BASE="${DOCKER_USER}/${IMAGE_NAME}"
          MINOR="${{ matrix.pg_minor }}"
          MAJOR="${{ matrix.pg_major }}"
          RDKIT="${{ matrix.rdkit_clean }}"

          SRC_AMD64="${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}-amd64"
          SRC_ARM64="${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}-arm64"

          # canonical full tag
          docker buildx imagetools create \
            -t "${BASE}:rocky${ROCKY_VERSION}-postgres${MINOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          # full tag with major PG version
          docker buildx imagetools create \
            -t "${BASE}:rocky${ROCKY_VERSION}-postgres${MAJOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          # simplified tags (no OS prefix, rocky9 is the only supported OS)
          docker buildx imagetools create \
            -t "${BASE}:postgres${MAJOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"

          docker buildx imagetools create \
            -t "${BASE}:postgres${MINOR}-rdkit${RDKIT}" \
            "${SRC_AMD64}" "${SRC_ARM64}"
