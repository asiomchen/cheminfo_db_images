name: Build RDKit Images (All Versions)

on:
  workflow_dispatch:
    inputs:
      min_rdkit_version:
        description: 'Minimum RDKit version to build (e.g. 2024.03.6)'
        required: false
        default: '2024.03.6'
      max_rdkit_version:
        description: 'Maximum RDKit version to build (e.g. 2025.09.1)'
        required: false
        default: ''
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

env:
  DOCKER_USER: antonsiomchen
  IMAGE_NAME: cheminfo-db
  DIST_IMAGE_NAME: rdkit-postgres-dist
  ROCKY_VERSION: "9"
  PG_MAJORS: "16 17 18"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - name: Detect versions and check Docker Hub
        id: detect
        env:
          MIN_RDKIT_VERSION_INPUT: ${{ inputs.min_rdkit_version }}
          MAX_RDKIT_VERSION_INPUT: ${{ inputs.max_rdkit_version }}
        run: |
          python3 << 'EOF'
          import json, os, re, urllib.error, urllib.request

          DOCKER_USER = os.environ["DOCKER_USER"]
          IMAGE_NAME  = os.environ["IMAGE_NAME"]
          DIST_IMAGE_NAME = os.environ["DIST_IMAGE_NAME"]
          ROCKY_VERSION = os.environ["ROCKY_VERSION"]
          PG_MAJORS   = os.environ["PG_MAJORS"].split()
          MIN_VERSION = os.environ.get("MIN_RDKIT_VERSION_INPUT") or "2024.03.6"
          MAX_VERSION = os.environ.get("MAX_RDKIT_VERSION_INPUT") or None

          def fetch_json(url):
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          def get_latest_pg_minor(major):
              url = f"https://registry.hub.docker.com/v2/repositories/library/postgres/tags/?page_size=100&name={major}."
              data = fetch_json(url)
              pattern = re.compile(r'^' + re.escape(str(major)) + r'\.\d+$')
              tags = [r["name"] for r in data["results"] if pattern.match(r["name"])]
              tags.sort(key=lambda s: [int(u) for u in s.split(".")])
              return tags[-1] if tags else None

          def version_tuple(v):
              return tuple(int(x) for x in v.split("."))

          def get_dist_versions_by_pg_major():
              versions = {}
              url = f"https://hub.docker.com/v2/repositories/{DOCKER_USER}/{DIST_IMAGE_NAME}/tags/?page_size=100"
              pattern = re.compile(r"^(\d+\.\d+\.\d+)-postgres(\d+)$")
              while url:
                  data = fetch_json(url)
                  for tag_info in data.get("results", []):
                      match = pattern.match(tag_info["name"])
                      if not match:
                          continue
                      rdkit_version, pg_major = match.groups()
                      versions.setdefault(pg_major, set()).add(rdkit_version)
                  url = data.get("next")
              return {
                  pg_major: sorted(pg_versions, key=version_tuple)
                  for pg_major, pg_versions in versions.items()
              }

          def tag_exists(tag):
              url = f"https://hub.docker.com/v2/repositories/{DOCKER_USER}/{IMAGE_NAME}/tags/{tag}/"
              req = urllib.request.Request(url, method="HEAD")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status == 200
              except urllib.error.HTTPError as e:
                  return e.code != 404

          def main():
              pg_minors = {}
              for major in PG_MAJORS:
                  minor = get_latest_pg_minor(major)
                  print(f"PG{major} latest minor: {minor}", flush=True)
                  if not minor:
                      continue
                  pg_minors[major] = minor

              min_v = version_tuple(MIN_VERSION)
              max_v = version_tuple(MAX_VERSION) if MAX_VERSION else None
              dist_versions = get_dist_versions_by_pg_major()
              if MAX_VERSION:
                  print(f"Using rdkit-postgres-dist tags for RDKit versions from {MIN_VERSION} to {MAX_VERSION}", flush=True)
              else:
                  print(f"Using rdkit-postgres-dist tags for RDKit versions >= {MIN_VERSION}", flush=True)

              matrix_entries = []
              merge_entries  = []

              for major, minor in pg_minors.items():
                  versions = [
                      v for v in dist_versions.get(major, [])
                      if version_tuple(v) >= min_v and (max_v is None or version_tuple(v) <= max_v)
                  ]
                  print(f"PG{major} rdkit-postgres-dist versions in range: {versions}", flush=True)
                  for rdkit_clean in versions:
                      tag = f"rocky{ROCKY_VERSION}-postgres{minor}-rdkit{rdkit_clean}"
                      print(f"Checking: {tag}", flush=True)
                      if tag_exists(tag):
                          print(f"  -> exists, skipping", flush=True)
                          continue
                      print(f"  -> missing, will build", flush=True)
                      for arch, runner, platform in [
                          ("amd64", "ubuntu-24.04",     "linux/amd64"),
                          ("arm64", "ubuntu-24.04-arm", "linux/arm64"),
                      ]:
                          matrix_entries.append({
                              "pg_minor":   minor,
                              "pg_major":   major,
                              "rdkit_ref":  f"Release_{rdkit_clean.replace('.', '_')}",
                              "rdkit_clean": rdkit_clean,
                              "rdkit_dist_image": f"{DOCKER_USER}/{DIST_IMAGE_NAME}:{rdkit_clean}-postgres{major}",
                              "arch":       arch,
                              "runner":     runner,
                              "platform":   platform,
                          })
                      merge_entries.append({
                          "pg_minor":   minor,
                          "pg_major":   major,
                          "rdkit_ref":  f"Release_{rdkit_clean.replace('.', '_')}",
                          "rdkit_clean": rdkit_clean,
                      })

              has_builds   = len(matrix_entries) > 0
              matrix       = json.dumps({"include": matrix_entries})
              merge_matrix = json.dumps({"include": merge_entries})
              print(f"has_builds={has_builds}, {len(merge_entries)} combos to build", flush=True)

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"matrix={matrix}\n")
                  f.write(f"merge_matrix={merge_matrix}\n")
                  f.write(f"has_builds={'true' if has_builds else 'false'}\n")

          main()
          EOF

  build-and-push:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    uses: ./.github/workflows/rdkit-reusable.yml
    with:
      matrix: ${{ needs.detect-versions.outputs.matrix }}
      merge_matrix: ${{ needs.detect-versions.outputs.merge_matrix }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
