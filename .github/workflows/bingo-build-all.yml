name: Build Bingo Images (All Versions)

on:
  workflow_dispatch:
    inputs:
      min_bingo_version:
        description: 'Minimum Bingo version to build (e.g. 1.34.0)'
        required: false
        default: '1.34.0'
      max_bingo_version:
        description: 'Maximum Bingo version to build (e.g. 1.36.0)'
        required: false
        default: ''
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: asiomchen
  IMAGE_NAME: bingo-postgres
  DIST_IMAGE_NAME: bingo-dist
  ROCKY_VERSION: "9"
  PG_MAJORS: "15 16 17"

jobs:
  detect-versions:
    name: Detect versions and find missing builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      merge_matrix: ${{ steps.detect.outputs.merge_matrix }}
      has_builds: ${{ steps.detect.outputs.has_builds }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect versions and check GHCR
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          MIN_BINGO_VERSION_INPUT: ${{ inputs.min_bingo_version }}
          MAX_BINGO_VERSION_INPUT: ${{ inputs.max_bingo_version }}
        run: |
          python3 -m scripts.actions prepare-bingo-runtime-all \
            --registry "${REGISTRY}" \
            --image-owner "${IMAGE_OWNER}" \
            --image-name "${IMAGE_NAME}" \
            --dist-image-name "${DIST_IMAGE_NAME}" \
            --rocky-version "${ROCKY_VERSION}" \
            --pg-majors "${PG_MAJORS}" \
            --min-bingo-version "${MIN_BINGO_VERSION_INPUT:-1.34.0}" \
            --max-bingo-version "${MAX_BINGO_VERSION_INPUT}"

  build-and-push:
    needs: detect-versions
    if: needs.detect-versions.outputs.has_builds == 'true'
    uses: ./.github/workflows/bingo-reusable.yml
    with:
      matrix: ${{ needs.detect-versions.outputs.matrix }}
      merge_matrix: ${{ needs.detect-versions.outputs.merge_matrix }}
